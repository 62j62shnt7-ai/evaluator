[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ut-inspection-evaluator"
version = "0.3.0"
description = "Offline inspection history, review, draft calculations and revisioned evidence"
requires-python = ">=3.12"
dependencies = ["openpyxl==3.1.5", "et-xmlfile==2.0.0"]

[project.scripts]
ut-review = "evaluator.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
evaluator = ["data/*.json", "data/templates/*.json", "static/*.html", "static/*.css", "static/*.js"]
